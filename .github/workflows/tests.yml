name: tests

# 仓库里有 180 个单元测试，但在此之前没有任何 workflow 在 PR 上跑它们——
# 现有 workflow 全是定时/push 触发的业务任务，改动合进 main 之前没有安全网。
#
# 装 requirements-report.txt（不含 yfinance / efinance）：两者都是函数体内惰性
# 导入，测试走不到，也不该联网。装上反而会掩盖"发信环境其实没有它们"这件事。

on:
  pull_request:
  push:
    branches: [main]
    # 每天六次的行情数据提交不该触发测试——它们不改代码
    paths-ignore:
      - 'stock_report/data/**'
      - 'stock_report/triggers/**'
      - 'daily_english/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-report.txt
      - name: Install deps
        run: pip install -r requirements-report.txt
      - name: Compile all sources
        run: python -m compileall -q stock_report *.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
