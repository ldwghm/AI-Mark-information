name: tests

# 仓库里有 180 个单元测试，但在此之前没有任何 workflow 在 PR 上跑它们——
# 现有 workflow 全是定时/push 触发的业务任务，改动合进 main 之前没有安全网。
#
# 只装 requests / numpy / pandas：yfinance 与 efinance 都是函数体内惰性导入，
# 测试不会走到那里，也不应该联网。

on:
  pull_request:
  push:
    branches: [main]
    # 每天六次的行情数据提交不该触发测试——它们不改代码
    paths-ignore:
      - 'stock_report/data/**'
      - 'stock_report/triggers/**'
      - 'daily_english/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不开 cache: pip —— 它要求仓库有 requirements.txt / pyproject.toml，
          # 本仓库两者皆无（各 workflow 各自内联 pip install）。三个包不值得
          # 为此引入一套依赖清单约定。
      - name: Install runtime deps
        run: pip install requests numpy pandas
      - name: Compile all sources
        run: python -m compileall -q stock_report *.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
