name: 获取AI板块数据（日报预取）
run-name: morning fetch ${{ inputs.request_id || github.run_id }}

on:
  push:
    branches: [main]
    paths:
      - 'stock_report/triggers/morning.json'
  schedule:
    - cron: '50 23 * * 0-4'  # 7:50 CST Mon-Fri (Sun-Thu UTC)
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Correlation ID supplied by the report routine'
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # 定时抓数是给 routine 备料的。GitHub 的 schedule 会漂——2026-08-13 这条
      # 23:50 UTC 的 cron 实际 00:44 才跑，那时 routine 已经用自己 push trigger
      # 抓的数据发完信、归了档，这次迟到的抓数只是把已投递的合并快照覆盖掉。
      # 已投递就没有备料的必要了。routine 主动 push trigger 的那次必须照跑。
      - name: Check whether today's report already shipped
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            state=$(python -m stock_report.pipeline_state --mode morning --check-delivered)
          else
            state=pending
          fi
          echo "delivered=$state" >> "$GITHUB_OUTPUT"
          echo "today's morning delivery: $state"
      - if: steps.guard.outputs.delivered != 'sent'
        run: python fetch_market_data.py
      - name: Stamp connector request
        if: github.event_name == 'push'
        run: |
          python -m stock_report.connector_trigger \
            --mode morning \
            --snapshot stock_report/data/morning_latest.json \
            --trigger stock_report/triggers/morning.json \
            --trigger-commit-sha "$GITHUB_SHA"
      - name: Commit data
        if: steps.guard.outputs.delivered != 'sent'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_report/data/morning_latest.json
          git diff --cached --quiet || git commit -m "data: morning market data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
