name: A股AI板块早报

on:
  push:
    branches: [main]
    paths:
      - 'stock_report/data/morning_analysis_candidate.json'
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Triggered by'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: morning-report-delivery
  cancel-in-progress: false

env:
  MODE: morning
  LATEST_PATH: stock_report/data/morning_latest.json
  ANALYSIS_PATH: stock_report/data/morning_analysis_candidate.json
  FINAL_ANALYSIS_PATH: stock_report/data/morning_analysis.json
  VERDICT_PATH: /tmp/morning_verdict.json
  HTML_PATH: /tmp/morning_report.html
  DELIVERY_PATH: /tmp/morning_delivery.json

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-report.txt
      - name: Verify exact candidate
        id: verify
        shell: bash
        run: |
          set +e
          python -m stock_report.verify \
            --mode "$MODE" \
            --latest "$LATEST_PATH" \
            --analysis "$ANALYSIS_PATH" \
            --verdict "$VERDICT_PATH"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0=通过 2=硬失败但降级发出 3=阻断（关注池覆盖率低于停发线）
          if [ "$code" -eq 3 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo '::warning::verify 判定 BLOCKED，本次不发送正式早报'
            exit 0
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
      - name: Render and send exact verified candidate
        if: steps.verify.outputs.blocked != 'true'
        run: python stock_report.py
        env:
          MARKET_DATA_PATH: ${{ env.LATEST_PATH }}
          ANALYSIS_PATH: ${{ env.ANALYSIS_PATH }}
          REPORT_HTML_PATH: ${{ env.HTML_PATH }}
          DELIVERY_RECEIPT_PATH: ${{ env.DELIVERY_PATH }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive exact delivery bundle
        if: steps.verify.outputs.blocked != 'true'
        shell: bash
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          python -m stock_report.pipeline_state \
            --mode "$MODE" \
            --date "$report_date" \
            --latest "$LATEST_PATH" \
            --analysis "$ANALYSIS_PATH" \
            --verdict "$VERDICT_PATH" \
            --html "$HTML_PATH" \
            --delivery "$DELIVERY_PATH"
          archive="stock_report/data/archive/$report_date/$MODE"
          cp "$ANALYSIS_PATH" "$FINAL_ANALYSIS_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$archive" "$FINAL_ANALYSIS_PATH"
          git diff --cached --quiet || git commit -m "report: archive $MODE delivery $report_date"
          git checkout -- "$ANALYSIS_PATH"
          git pull --rebase
          git push
      - name: Record blocked delivery and fail
        if: steps.verify.outputs.blocked == 'true'
        shell: bash
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          blocked_dir="stock_report/data/blocked/$report_date/$MODE"
          mkdir -p "$blocked_dir"
          cp "$VERDICT_PATH" "$blocked_dir/verdict.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$blocked_dir"
          git diff --cached --quiet || git commit -m "report: blocked $MODE delivery $report_date"
          git checkout -- "$ANALYSIS_PATH" || true
          git pull --rebase
          git push
          echo '--- block reasons ---'
          python -c "import json;print('\n'.join(json.load(open('$VERDICT_PATH',encoding='utf-8')).get('block_reasons',[])))"
          # 故意失败：让 pipeline-health 与 Actions 通知看得见，绝不静默跳过
          exit 1
